services:
  scrapforai-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scrapforai-api
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      HOST: ${HOST}
      SCRAPFORAI_API_KEY: ${SCRAPFORAI_API_KEY}
      ALLOWED_TARGET_ORIGINS: ${ALLOWED_TARGET_ORIGINS}
      ALLOWED_RESOURCE_ORIGINS: ${ALLOWED_RESOURCE_ORIGINS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      MAX_STEPS_PER_JOB: ${MAX_STEPS_PER_JOB}
      JOB_TIMEOUT_MS: ${JOB_TIMEOUT_MS}
      STEP_TIMEOUT_MS: ${STEP_TIMEOUT_MS}
      MAX_REQUEST_BODY_SIZE: ${MAX_REQUEST_BODY_SIZE}
      MAX_PARALLEL_JOBS: ${MAX_PARALLEL_JOBS}
      MAX_DOM_SNAPSHOT_CHARS: ${MAX_DOM_SNAPSHOT_CHARS}
      # WARNING: evaluate/watch execute arbitrary in-page JavaScript. Keep false outside trusted local use.
      ALLOW_EVALUATE: ${ALLOW_EVALUATE:-false}
      MAX_EVALUATE_SCRIPT_CHARS: ${MAX_EVALUATE_SCRIPT_CHARS:-4000}
      MAX_EVALUATE_RESULT_CHARS: ${MAX_EVALUATE_RESULT_CHARS:-20000}
      EVALUATE_TIMEOUT_MS: ${EVALUATE_TIMEOUT_MS:-5000}
      MAX_WATCH_DURATION_MS: ${MAX_WATCH_DURATION_MS:-30000}
      MIN_WATCH_INTERVAL_MS: ${MIN_WATCH_INTERVAL_MS:-100}
      MAX_WATCH_SAMPLES: ${MAX_WATCH_SAMPLES:-200}
      ARTIFACT_RETENTION_HOURS: ${ARTIFACT_RETENTION_HOURS}
      ARTIFACT_DIR: ${ARTIFACT_DIR}
      LOG_LEVEL: ${LOG_LEVEL}
      PLAYWRIGHT_BROWSER: ${PLAYWRIGHT_BROWSER}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./artifacts:/app/artifacts
    restart: unless-stopped

  cloudflared-quick-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: scrapforai-cloudflared-quick-tunnel
    command: tunnel --url http://scrapforai-api:3000 --no-autoupdate
    depends_on:
      - scrapforai-api
    profiles:
      - tunnel
    restart: unless-stopped
